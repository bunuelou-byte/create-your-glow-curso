<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso! | CREATE YOUR GLOW</title>

    <!-- SDKs de Firebase (Versión Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCR724EP9rNkKtETG1xM_CGSQ1ZIHhbOhc",
            authDomain: "create-your-glow.firebaseapp.com",
            projectId: "create-your-glow",
            storageBucket: "create-your-glow.firebasestorage.app",
            messagingSenderId: "917183846981",
            appId: "1:917183846981:web:214a14dbefdbdcc017612c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>

    <style>
        :root {
            --burgundy: #5A1030;
            --hot: #F06BAE;
            --pink: #F7A8D0;
            --pink-soft: #FBD3E6;
            --cream: #FFF8E6;
            --ink: #2A1220;
            --font-chunk: 'Bowlby One', sans-serif;
            --font-script: 'Pinyon Script', cursive;
            --font-body: 'Jost', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--cream);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .success-card {
            background: #fff;
            padding: 3rem 2rem;
            border-radius: 32px;
            box-shadow: 0 18px 36px rgba(90, 16, 48, 0.15);
            max-width: 500px;
            width: 100%;
            border: 3px solid var(--pink-soft);
        }

        .success-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: var(--font-chunk);
            color: var(--burgundy);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: var(--ink);
            font-size: 1.05rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-block;
            background: var(--burgundy);
            color: var(--cream);
            padding: 0.9rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: var(--hot);
            color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h1>¡Pago Aprobado! 🎉</h1>
        <p id="mensajeEstado">Estamos registrando tu inscripción al curso y preparando tu acceso...</p>
        <a href="mis-cursos.html" class="btn-home" id="btnMisCursos" style="display: none;">Ir a Mis Cursos 💖</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const msg = document.getElementById('mensajeEstado');
            const btn = document.getElementById('btnMisCursos');

            const mostrar = (texto) => {
                msg.innerText = texto;
                btn.style.display = 'inline-block';
            };

            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    mostrar("Pago exitoso, por favor inicia sesión en tu cuenta para ver tu curso.");
                    return;
                }

                // El ref tiene el formato: uid_courseId
                const ref = new URLSearchParams(window.location.search).get('ref') || '';
                const idx = ref.indexOf('_');

                if (idx <= 0) {
                    mostrar("¡Pago exitoso! Ya puedes disfrutar de tus formaciones.");
                    return;
                }

                const refUid = ref.slice(0, idx);
                const courseId = ref.slice(idx + 1);

                if (!courseId) {
                    mostrar("¡Pago exitoso! Ya puedes disfrutar de tus formaciones.");
                    return;
                }

                // Evita registrar el pago a nombre de otra cuenta
                if (refUid !== user.uid) {
                    mostrar("Pago recibido, pero esta cuenta no coincide con la que pagó. Inicia sesión con la cuenta correcta.");
                    return;
                }

                try {
                    // Título real del curso desde la colección "courses"
                    let courseTitle = "Curso Especializado";
                    try {
                        const courseDoc = await db.collection("courses").doc(courseId).get();
                        if (courseDoc.exists && courseDoc.data().title) {
                            courseTitle = courseDoc.data().title;
                        }
                    } catch (e) {
                        console.log("No se pudo leer el título del curso, usando valor por defecto.");
                    }

                    // Evita inscripciones duplicadas si el usuario recarga la página
                    const existente = await db.collection("inscripciones")
                        .where("userId", "==", user.uid)
                        .where("courseId", "==", courseId)
                        .limit(1)
                        .get();

                    if (existente.empty) {
                        await db.collection("inscripciones").add({
                            userId: user.uid,
                            courseId: courseId,
                            courseTitle: courseTitle,
                            enrolledAt: firebase.firestore.FieldValue.serverTimestamp(),
                            status: "active",
                            leccionesCompletadas: [],
                            progreso: 0
                        });
                    }

                    mostrar("¡Inscripción completada con éxito! Ya puedes acceder a tu contenido exclusivo.");
                } catch (error) {
                    console.error("Error al registrar inscripción:", error);
                    mostrar("Tu pago fue exitoso, pero hubo un detalle de sincronización. Por favor reintenta o contáctanos.");
                }
            });
        });
    </script>
</body>
</html>
